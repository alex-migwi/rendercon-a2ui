<!doctype html>
<html lang="en">
  <head>
    <script>
      // Runtime Environment: HMR disabled in sandbox iframe.
      // Intercept Vite HMR WebSocket connections to prevent unhandled closed-without-opened rejections.
      (function () {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          function ViteHmrSafeWebSocket(url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && url.includes('token='));

            if (isViteHmr) {
              const target = new EventTarget();
              target.readyState = 1; // WebSocket.OPEN
              target.OPEN = 1;
              target.CLOSED = 3;
              target.CLOSING = 2;
              target.CONNECTING = 0;
              target.send = function () {};
              target.close = function () {};
              target.addEventListener = target.addEventListener.bind(target);
              target.removeEventListener = target.removeEventListener.bind(target);
              target.dispatchEvent = target.dispatchEvent.bind(target);
              return target;
            }
            return new OrigWebSocket(url, protocols);
          }
          ViteHmrSafeWebSocket.prototype = OrigWebSocket.prototype;
          ViteHmrSafeWebSocket.OPEN = 1;
          ViteHmrSafeWebSocket.CLOSED = 3;
          ViteHmrSafeWebSocket.CLOSING = 2;
          ViteHmrSafeWebSocket.CONNECTING = 0;
          window.WebSocket = ViteHmrSafeWebSocket;
        }

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (
              event.reason &&
              ((event.reason.message && event.reason.message.includes('WebSocket')) ||
                (event.reason.stack && event.reason.stack.includes('@vite/client')))
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event.message && event.message.includes('WebSocket')) ||
              (event.filename && event.filename.includes('@vite/client')) ||
              (event.error && event.error.stack && event.error.stack.includes('@vite/client'))
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow WebMCP & A2UI</title>
    <meta name="description" content="Next-generation intelligent Todo app demonstrating WebMCP tool execution, A2UI generative interface cards, and multi-model chat (Gemini, LM Studio, Ollama)." />
    <meta property="og:title" content="TaskFlow WebMCP & A2UI" />
    <meta property="og:description" content="Next-generation intelligent Todo app demonstrating WebMCP tool execution, A2UI generative interface cards, and multi-model chat (Gemini, LM Studio, Ollama)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
